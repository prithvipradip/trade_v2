# AIT v2 — RESEARCH CONFIGURATION (W68 overlay; W88 research tunables).
#
# This file has THREE jobs:
#   1. DIFF   Keys that also exist in config.yaml appear here ONLY when research deliberately differs from live.
#             A copy of a shared key would stop following a later config.yaml change (and a test fails on it), so
#             this part of the file IS the research-vs-live difference.
#   2. OVERLAY It is deep-merged OVER config.yaml by RESEARCH entry points only (ait.config.research.
#             use_research_config: run_backtest.py, run_optimizer.py, scripts/friction_sensitivity.py,
#             scripts/gate_study.py). The live bot (ait.main) and the supervisor never load it. Unknown keys are a
#             startup error (the schema is extra="forbid").
#   3. TUNABLES (W88b) Keys that exist ONLY in research (learner thresholds, objective weights, engine knobs, ...)
#             are listed here IN FULL with their documentation, so a researcher sees every value a study can vary
#             without reading code. Their schema defaults in src/ait/config/settings.py are the fallback for bare
#             constructions; a test fails if a research-only field is missing from this file.
#
# A single study can merge a THIRD layer over this file (studies/<name>.yaml, --study-file; W87b); this file stays
# the stable default for ordinary research runs, so do not edit it per study. Values that are NOT tunable (clamps,
# numerical tolerances) are fixed in src/ait/config/invariants_research.py and listed in docs/RUNBOOK.md
# ("Research fixed limits"). `python scripts/show_research_config.py` prints every value with the layer that decides it.
#
# Keep every research change on this branch HERE, with its provenance comment. config.yaml differs from
# main only by the five operator-chosen live risk/capital lines (account.capital, simulate_live_capital,
# risk.max_daily_loss_pct, risk.breaker_to_max_loss_ratio, risk.max_position_risk_pct) plus the removal of
# backtest.initial_capital (the field no longer exists: capital lives at account.capital).

backtest:
  position_size_pct: null              # W64: null -> risk.max_position_risk_pct (what live funds the
                                       # builder with), so research cannot drift from live. main has 0.05.
  budget_aware_wings: true             # W64: research condor builder caps the wing to the budget like live
                                       # (IronCondor.affordable_width, $1 floor when capped) and rejects a
                                       # structure whose max loss exceeds the budget.

  # --- W65/W91: research history (stored IB history in the shared tables; the retrain only appends) ---
  history_start_date: 2024-01-01       # first day of the operator's economic-calendar CSV, so the research
                                       # macro gate is ON in every window. Wins over history_days.
  history_days: 1826                   # legacy fallback span (no start date)
  research_history: true               # W91: read the stored history tables (was implied by research_table_prefix);
                                       # research_table_prefix is "" now = the one shared set of tables
  vlmc_min_coverage: 0.95              # 5-min day coverage required to train with VLMC/intraday-fractal features
  macro_event_types: [FOMC, CPI, NFP, PCE, GDP]   # = live's five, for parity

  # --- W66: selector + friction model v2 ---
  condor_any_direction: false          # 2026-10-10 operator decision: keep OFF. Research keeps the NEUTRAL-only
                                       # selector because the neutral/bearish/bullish direction models are what
                                       # is being improved next; revisit once they are.
  friction_model: per_leg_usd          # fitted $/leg half-spread, entry AND exit (legacy % overcharged a $0.95-credit
                                       # QQQ condor $0.669 vs ~$0.085 measured). Missing fit -> legacy + WARNING.
  friction_entry_capture: 1.0          # share of the quoted half-spread paid per leg at entry (1.0 = full, conservative)
  friction_exit_capture: 1.0           # ... and at exit; lower only from the fill-vs-model report
  friction_stress_multiplier: 1.0      # scales the fitted model (calm-regime sample hedge)

  # --- W79a: operator decisions of 2026-10-12 (D1, D8) ---
  engine_model: realistic              # D1: the research engine at live fidelity: fill-time spot, previous-session IV and
                                       # DECISION FRAME (W78), listed session expiries, fractional time, same-session
                                       # exits, touch stops, expiry settlement / assignment gap (W77), concurrency at the
                                       # fill (W78). Evidence: PLAN W74, W77, W78. Default research numbers recorded before
                                       # this date are superseded (assumption A10). The legacy engine stays byte-identical.
  friction_short_dte: true             # D8: a 0-6 DTE leg is charged at least the $0.01 floor until its band has 15
                                       # collected sessions (W76); a band with its own fit then switches to it. Before the
                                       # flip the fitted all-DTE model was EXTRAPOLATED below 11 DTE.
                                       # pricing_source stays bs_legacy: D2 waits for the option-bar backfill.

  # --- W71c: the IV-rank RISE veto is OFF in research (operator decision D9, 2026-10-13) ---
  iv_rank_rise_gate: false             # WHAT: research-only veto. Blocks a neutral credit entry when the FeatureEngine
                                       #   iv_rank (a REALIZED-vol range rank, 0-1) rose by more than
                                       #   backtest.iv_rank_rise_threshold (0.30) over 10 rows.
                                       # WHY OFF: live has NO such veto (it gates on the stored-IV percentile LEVEL: condor
                                       #   floor 15, credit cap 85, ait.data.iv_rank). The research series is a weak proxy of
                                       #   that rank (Spearman 0.46-0.63; opposite side of live's floor/cap on 34-42% of
                                       #   days); 45-58% of the days it blocks live already refuses; the rest (4.5-5.4% of
                                       #   tradeable days) are days live WOULD trade. A/B on the realistic engine: it removes
                                       #   3-6 trades per symbol and is slightly negative (inside the noise). PLAN.md W71.
                                       # WHAT WAS KEPT: the code, the threshold (0.30) and its 0.25-0.60 search range, and the
                                       #   per-entry record `iv_rank_rise_10d`. Only the veto is off; while it is off the
                                       #   optimizer does not search the threshold (a searched value would re-enable it).
                                       # RE-ENABLE BAR: only if a MULTI-WINDOW walk-forward with the gate ON vs OFF (the same
                                       #   windows, engine, pricing and friction; scripts/iv_rank_parity_probe.py --ab is the
                                       #   starting tool) shows an OUT-OF-SAMPLE gain, beyond the window-to-window noise, on
                                       #   days live's level gates (floor 15 / cap 85) would have TRADED. A gain that appears
                                       #   only on days live already refuses is not evidence for it.
                                       # IF IT EARNS ITS PLACE: set true here AND port it to live (a W80-class change), so
                                       #   research does not keep a gate the bot lacks. Until then: research-only, off.

  # --- W81: the trending-down REGIME veto (research-only; switch built, operator decision D10 OPEN) ---
  # regime_veto_gate: true             # NOT SET HERE ON PURPOSE: the schema default (true) applies, so nothing moves.
                                       # WHAT: research-only veto. Blocks a neutral credit entry when 5-day realized vol
                                       #   exceeds 20-day (vol_regime_expanding) AND price is more than 5% below its 20-day
                                       #   SMA (backtest.regime_down_threshold). Live has NO such entry veto: its regime
                                       #   class feeds only the direction override, the meta-label features and roll
                                       #   defense. The comment that introduced it records "4 trending_down trades, 25% win
                                       #   rate" (Exp 21), i.e. a 4-trade evidence base.
                                       # MEASURED (W81, scripts/gate_parity_ab.py, realistic engine, 2024-01..2026-10, 1
                                       #   contract): the veto REACHED the engine on 0 days for QQQ (entry DTE 1, 3, 7, 14)
                                       #   and SPY (DTE 14) and on 3 days for IWM at every DTE tried: the position-slot and
                                       #   IV-rank gates sit in front of it. It moves IWM by between -$79 and +$109 (DTE 7
                                       #   vs 14; 3 trades) and nothing else. Inert, not shown useful.
                                       # TO TURN IT OFF: set regime_veto_gate: false here (code, thresholds and the per-entry
                                       #   class record are kept; a suppressed day is flagged regime_veto_suppressed). The bar
                                       #   to KEEP it is the D9 bar: an out-of-sample gain on days live would have traded.
                                       #   Re-run scripts/gate_parity_ab.py if the gate order, the IV-rank cap or the entry DTE
                                       #   range changes (the gates only matter on days that reach them).
                                       # SAME FILE, SAME QUESTION: max_entry_vol_annual (the realized-vol cap, 0.80) and the
                                       #   live-only VIX halt (risk.credit_vix_halt) are the other two one-sided entry gates;
                                       #   both were also inert in that A/B (0 days gated; 0 trades on VIX >= 28 days).

  # --- W84: live's ex-dividend ENTRY block, research twin (operator decisions 2026-10-16) ---
  ex_div_entry_gate: live              # WHAT: refuse a new position that SELLS A CALL when an ex-dividend date falls in
                                       #   [entry, expiry]: live's W51 block (orchestrator trade_blocked_ex_div), which
                                       #   exists because a short call can be assigned early the day before an ex-date.
                                       # WHY LIVE: parity. Live refuses 14-17% of sessions this way (SPY / QQQ / IWM,
                                       #   2024-01..2026-10, entry DTE 14); before W84 research traded those days and
                                       #   earned 22-39% of its reference P&L on them (PLAN.md 2026-10-16 finding).
                                       # MODES: off | live (ONE projected ex-date, dividends.project_next_ex_div over the
                                       #   ex-dates known before the entry day: exactly live's rule) | exact (any real
                                       #   ex-date in the window) | last_k_days (a real ex-date within
                                       #   backtest.ex_div_entry_k_days, default 5, of expiry: the F2 candidate).
                                       # DATA: research_dividends (scripts/backfill_dividends.py); any mode but off raises
                                       #   without it, so the gate can never be silently inert.
                                       # MEASURED: scripts/ex_div_gate_ab.py, recorded in the W84 AS BUILT PLAN entry.
                                       # TO CHANGE: a study may pass another mode; changing the default here needs a PLAN
                                       #   entry. If live's rule changes (F2 / F3), change this mode with it.

  # --- W67: gate parity + graded objective ---
  gates_mode: enforce                  # 2026-10-10 operator decision: ML gates ON in RESEARCH (range floor + fractal veto
                                       # block) so the models being improved actually matter in studies. Live stays
                                       # ml.entry_gates_enabled=false (observe) — a DELIBERATE research-vs-live deviation
                                       # that the run_backtest parity manifest will show. `observe` reproduces live today.
  fractal_veto_spread: 0.0             # absolute hurst spread veto for neutral structures (0 = off = live today)
  penalty_on_range_prob: 0.0           # fractal penalty also lowers P(in range) (0 = off = live today)
  optimize_hard_min_trades: 3          # below this a trial scores on the graded floor (not a flat -100)
  optimize_below_floor_gradient: 20.0  # -100 (0 trades) rising toward -80; 0 restores the flat -100

  # --- W68: IV-rank parity (research up to date with live) ---
  iv_rank_gate: true                   # live's two IV-RANK gates on credit entries: condor refuses rank < ic_iv_rank_floor
                                       # (15, backtest.ic_iv_rank_floor) and the risk manager refuses rank > risk.iv_rank_cap
                                       # (85); unmeasurable rank fails closed. Shared definition: ait.data.iv_rank.
  iv_floor: 0.05                       # the schema minimum. The absolute-level floor (main: 0.20) was research's ONLY IV gate
                                       # and also floored leg IVs when pricing: left at 0.20 it would price a 12%-IV SPY
                                       # day at 20% (fat fake credits) now that the rank gate lets such days trade. Demoted
                                       # to a pricing sanity floor; live has no level gate.

  # =====================================================================================================
  # RESEARCH TUNABLES (W88b): research-only keys, listed IN FULL. Each value equals its schema default in
  # src/ait/config/settings.py ON PURPOSE (like the `parity:` block below): this file is the visible, editable
  # home; the schema default is only the fallback for a bare construction. They have no config.yaml
  # counterpart, so listing them does not shadow a live key. A study (studies/<name>.yaml) may override any
  # of them. The meaning, bounds and provenance of each are the `description=` in settings.py.
  # A test fails if a field of these four blocks is missing here.
  # =====================================================================================================

  # --- the research BacktestLearner (backtesting/learner.py): adapts strategy multipliers, the confidence
  #     floor and symbol disabling between walk-forward windows. NOT the live learning layer (`learning:`). ---
  learner:
    windows_before_adapting: 2         # the first window only accumulates
    min_trades_to_learn: 15            # evidence before a strategy / symbol / confidence band is judged
    min_trades_to_disable: 25          # evidence before a strategy or symbol is disabled outright
    protected_strategies: [iron_condor]  # may be reduced, never disabled
    strategy_multiplier_min: 0.30      # floor of a strategy's size multiplier
    strategy_multiplier_max: 2.0       # cap of a strategy's size multiplier
    reduce_win_rate: 0.30              # win rate below which (and negative avg P&L) a strategy is reduced
    reduce_factor: 0.80                # multiplier x this per reduction
    reduce_min_change: 0.03            # a reduction smaller than this is not applied (NOTE: with the 0.30 floor this
                                       #   stalls a protected condor at 0.3277 and makes disabling unreachable)
    boost_win_rate: 0.58               # win rate above which (and positive avg P&L) a strategy is boosted
    boost_min_trades: 6                # inert at any value <= min_trades_to_learn (15), which already gates the loop
    boost_factor: 1.20
    boost_min_change: 0.05
    reenable_win_rate: 0.50            # a disabled strategy returns above this win rate
    reenable_min_trades: 10            # inert at any value <= min_trades_to_learn (15); bites once set above it
    reenable_multiplier: 0.5           # ... at this size
    confidence_cap: 0.85               # highest minimum-confidence the learner may raise the entry floor to
    confidence_low_band_upper: 0.65    # entry confidence below this is the "low" band
    confidence_mid_band_upper: 0.75    # below this (and not low) is "medium"
    confidence_raise_win_rate: 0.35    # low band winning less often than this (and losing money) raises the floor
    confidence_raise_step: 0.05
    confidence_raise_min_change: 0.01
    symbol_disable_win_rate: 0.20      # win rate below which (min_trades_to_disable trades) a symbol is disabled
    default_entry_confidence: 0.65     # confidence assumed for a trade record that carries none

  # --- legacy / dormant engine paths: none is on the iron-condor path under engine_model: realistic, but each
  #     changes results for the structures that use it ---
  legacy_engine:
    naked_margin_fraction: 0.20        # margin proxy for NAKED short structures: this fraction of spot x 100
    fallback_weight_5d: 0.6            # fallback direction score = w5 * ret_5d + w20 * ret_20d (no predictor loaded)
    fallback_weight_20d: 0.4
    fallback_threshold: 0.005          # |score| above this is directional, else NEUTRAL
    fallback_confidence_base: 0.5      # directional confidence = base + |score| * slope, capped
    fallback_confidence_slope: 10.0
    fallback_confidence_cap: 0.95
    fallback_neutral_confidence: 0.4
    bearish_confidence_margin: 0.05    # a BEARISH directional entry needs min_confidence + this
    thesis_invalidation_confidence: 0.80  # legacy engine: an opposing prediction this confident closes a directional position

  # --- Optuna objectives (optimization/objectives.py) ---
  objectives:
    sharpe_weight: 0.4                 # composite = sharpe_weight * Sharpe + win_rate_weight * win rate
    win_rate_weight: 0.4               #             - drawdown_penalty * |max drawdown|
    drawdown_penalty: 0.2
    profit_factor_cap: 10.0            # the profit_factor objective is min(PF, this)

  # --- W90c: constants of the research engine's live (iron-condor) path ---
  engine_tuning:
    put_skew_coefficient: 0.10         # leg-IV model: skew_factor x ln-moneyness OTM x this (the W5 measured slope is added on top)
    call_skew_coefficient: 0.02        # ... the call side (mild: the measured call slope is sign-unstable)
    iv_rank_rise_lookback_rows: 11     # rows the IV-rank-rise veto looks at (11 = a 10-day rise)
    vol_gate_lookback_rows: 11         # closes the realized-vol entry gate measures (11 = 10 returns)
    min_history_bars: 20               # no decision before this many bars of history
    fallback_iv: 0.25                  # volatility assumed for a position with no entry_iv, and by realized_vol with too few prices

  # --- W90f: the research IV surface's acceptance rules (used when pricing_source is "surface"); part of the surface cache key ---
  surface_tuning:
    min_volume: 10                     # a bar needs this daily volume to enter a smile fit
    min_price: 0.05                    # ... and this close (below it the IV is tick noise)
    max_abs_moneyness: 0.10            # only strikes within |ln(K/S)| of this are fitted
    min_points: 5                      # a (date, expiry) smile needs this many bars
    min_span: 0.01                     # ... covering at least this much log-moneyness
    iv_lower_bound: 0.03               # solved IVs outside [lower, upper] are discarded
    iv_upper_bound: 2.5
    clamp_margin: 0.01                 # a smile is evaluated at most this far outside its fitted range
    max_stale_days: 5                  # a query may use a surface dated at most this many calendar days earlier

  # --- W90f: minimum data for fitting a leg-spread (friction) model (offline calibration, not a backtest) ---
  friction_fit:
    min_samples: 5                     # fewer usable samples and no model is fitted
    min_sessions_for_cv: 3             # leave-one-session-out CV needs this many trading days (else in-sample)
    min_train_rows: 3                  # a CV fold with fewer training rows is skipped
    min_affine_points: 3               # the affine form needs this many points (else a constant)

  # --- W90f: sizing of the single-structure builders (credit spreads, iron butterfly, jade lizard, debit structures); the
  # iron-condor builder does not read these ---
  spread_tuning:
    max_cost_fraction_of_capital: 0.25 # max loss / cost per contract may not exceed this share of capital
    wing_expected_move_fraction: 0.5   # wing = wing_k x expected move x this (iron butterfly, credit spreads, jade lizard)

  # --- walk-forward / optimizer constants ---
  walkforward_tuning:
    warm_start_min_win_rate: 0.75      # warm-start a window's study from the PRIOR window's best params only above this OOS win rate
    warm_start_min_trades: 3           # ... with at least this many trades (else the global best)
    range_threshold_multiplier: 1.25   # adaptive range threshold = realized vol x sqrt(horizon/252) x this
    range_threshold_low_clip: 0.02     # clipped to [low, high]
    range_threshold_high_clip: 0.15
    range_threshold_lookback_days: 60  # trailing days of training data the realized vol uses
    range_threshold_min_observations: 10  # fewer return observations => the fallback band
    range_threshold_fallback: 0.05     # fixed +/- containment band (live's range-model band) when the adaptive one cannot be computed
    optimize_val_split_ratio: 0.20     # share of an Optuna training window held out as validation (when scored on a validation slice)
    inert_probe_iv_fallback: 0.15      # the "is wing_k inert" probe: IV assumed when the data has none
    inert_probe_iv_quantile: 0.10      # ... else this quantile of the data's IV (the narrowest wing the study needs)
    inert_probe_dte_fallback: 21       # ... and this entry DTE when no settings are loaded
    optimize_seed: 42                  # W90a: seed of the Optuna TPE sampler (walk-forward windows and a bare StrategyOptimizer)
    # W90b: walk-forward geometry and evaluation constants (were dataclass / helper literals; values unchanged)
    train_days: 365                    # calendar days of each training window (also StrategyOptimizer's history window); --train-days overrides
    test_days: 63                      # calendar days of each out-of-sample test window
    step_days: 63                      # slide per window; == test_days => NON-overlapping tests (BT-M5)
    gap_days: 5                        # purge gap between training end and test start
    optimize_n_trials: 50              # Optuna trials per window with --optimize-per-window; --optimize-n-trials overrides
    optimizer_n_trials: 100            # trials of a standalone run_optimizer.py run; --n-trials overrides
    min_train_rows: 50                 # a symbol with fewer training bars is skipped for the window
    min_test_rows: 5                   # ... or fewer test bars
    context_padding_days: 900          # VIX/SPY context loaded before the training window (feature warm-up)
    context_span_padding_days: 400     # ... or, with a research history span configured, the span plus this
    fetch_padding_days: 100            # margin added to train+test days when fetching price history
    history_span_padding_days: 30      # margin added to the research-history span when sizing the fetch
    oos_direction_return_threshold: 0.02  # forward return separating bull/neutral/bear in the OOS direction diagnostic
    oos_calibration_bins: 8            # reliability-chart bins, direction model
    prob_score_bins: 9                 # reliability-chart bins, range model
    oos_min_extra_rows: 20             # bars beyond the label horizon the OOS direction evaluation needs
    oos_min_labelled_rows: 10          # ... and at least this many labelled rows
    oos_range_min_extra_rows: 5        # bars beyond the label horizon the OOS range evaluation needs
    min_windows: 3                     # a run with fewer walk-forward windows aborts / is flagged as too few to judge
    window_score_full_credit_trades: 5 # a window's score = win rate x sqrt(min(1, trades / this))

# --- W72: parity replay tolerances (scripts/parity_replay.py; schema: ParityConfig) ---
# Research-only: decides whether a DTE band's research can be trusted before an Optuna study is run on it.
# Values equal the schema defaults ON PURPOSE: this block is the operator-visible, editable home of the
# thresholds (assumption A6 of the 2026-10-11 short-DTE programme). It does not shadow a live key.
parity:
  credit_error_pct_max: 0.15           # median |modelled - actual| entry credit / actual credit, per DTE band
  credit_bias_pct_max: 0.10            # |median signed error| / actual credit, per DTE band
  min_trades_per_band: 3               # fewer closed trades than this => INSUFFICIENT, never PASS
  dte_band_upper_edges: [2, 7, 14, 45] # 0-2, 3-7, 8-14, 15-45, 46+
