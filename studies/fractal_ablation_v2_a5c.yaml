# W119 S1 v2: does any block of the fractal columns change the out-of-sample Brier score of the seed-averaged range model? Arm a5c.
#
#   python scripts/fractal_ablation_study.py --run-v2 --arm a5c --label v2_base
#
# The rule, the arms, the windows and the decision rule are in PLAN.md "W119 S1 v2 AS PLANNED". Commit this file BEFORE the
# run; do not edit it afterwards (a changed study is a new file).

name: fractal_ablation_v2_a5c
question: >
  Arm a5c: the deterministic control: the MFDFA block off AND column sampling off (colsample_bytree 1.0). Does the out-of-sample Brier score of the 5-seed average range model change (abstention scored as the training in-range rate)?
rule: W119 S1 v2 AS PLANNED

settings:
  ml:
    features:
      fractal:
        use:
          multifractal_width: false
          multifractal_asymmetry: false
    hyperparams:
      colsample_bytree: 1.0
