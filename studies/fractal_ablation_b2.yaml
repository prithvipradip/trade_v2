# W119 S1: does any block of the fractal columns add out-of-sample skill to the range model? Arm b2 (S1b).
#
#   python scripts/fractal_ablation_study.py --dry-run
#
# The rule, the arms, the windows and the decision rule are in PLAN.md "W119 S1 AS PLANNED". Commit this file BEFORE the
# run; do not edit it afterwards (a changed study is a new file).

name: fractal_ablation_b2
question: >
  Arm b2: all seventeen fractal columns off. Does the out-of-sample skill of the range model change (Brier skill and AUROC against climatology, per window)?
rule: W119 S1 AS PLANNED

settings:
  ml:
    features:
      fractal:
        use:
          hurst_wavelet: false
          hurst_fit_r2: false
          psd_beta: false
          psd_fit_r2: false
          hurst_psd_divergence: false
          hurst_short: false
          hurst_long: false
          hurst_scale_spread: false
          multifractal_width: false
          multifractal_asymmetry: false
      intraday:
        use:
          hurst_wavelet_intraday: false
          hurst_scale_spread_intraday: false
          wavelet_L3_energy: false
          wavelet_L4_energy: false
          wavelet_L5_energy: false
          psd_beta_intraday: false
          mfdfa_width_intraday: false
