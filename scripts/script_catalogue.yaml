scripts/probe_w101_combo_close.py:
  group: IB paper probe
  what: "Probe of whether a four-leg iron-condor CLOSE fills on the paper account, at what concession over the legs' natural price, and why it does not. It opens a one-lot SPY or QQQ condor (`open`; kinds far, pin and nobid, the last with a long call wing nobody bids for), closes it with the bot's own leg-priced ladder, one new order per rung with a confirmed cancel between them and a clamp under IB's price band (`close`; `--emulate-delay 900` prices each rung from the quotes of 15 minutes earlier, `--require-nobid` insists on an unbid sold leg, `--exclude-unbid` leaves a worthless unbid long leg out of the combo), and records which feed the quotes came from and how the market moved. `flatten` closes by combo, then leg by leg (shorts first). `quotes` shows the legs' bids, asks and feed type. `report` reads the evidence and states a verdict. `open`, `close`, `flatten` and `cancel` PLACE or CANCEL ORDERS."
  when: "Only as a deliberate experiment during market hours on a paper account, with the supervisor and the bot stopped (`open`, `close` and `flatten` refuse while data/orchestrator.lock is held, or in market hours while data/bot_heartbeat is fresh). It refuses an account whose id does not start with D, any client id other than 96, and a position or working order on the contracts it would trade that it does not own. Your own positions on other contracts are left alone."
  needs_ib: "yes"
  writes: "Orders on the paper account (SPY or QQQ, one lot, every orderRef starts W101PROBE, no combo limit above the wing width); state in reports/w101_probe/state.json and JSONL evidence under reports/w101_probe/<date>/; data/ait_state.db read-only. IB client id 96. `preflight` (the default), `quotes`, `status` and `report` place nothing, and `report` does not connect. A Ctrl-C or an error cancels the probe's working orders and never flattens."
  example: "python scripts/probe_w101_combo_close.py preflight"
  explained: "-"
  stamp: "69d65a9d1138"

