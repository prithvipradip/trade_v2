[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ait"
version = "2.0.0"
description = "Autonomous Intelligent Trading - Options trading bot with ML and sentiment analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    # IBKR
    "ib_insync>=0.9.86",
    # Data
    "yfinance>=0.2.36",
    "polygon-api-client>=1.14",
    "pandas>=2.2",
    "numpy>=1.26,<2.0",  # PyTorch 2.2.2 compiled against NumPy 1.x; 2.x breaks inference
    "pandas-market-calendars>=4.4",
    # ML (lightweight - no TensorFlow/PyTorch)
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # Options Greeks
    "py-vollib>=1.0.1",
    "scipy>=1.12",
    # Sentiment
    "transformers>=4.38,<4.45",  # FinBERT; >=4.45 blocks torch.load when torch<2.6 (CVE-2025-32434)
    "torch>=2.2,<2.3",          # CPU-only for FinBERT inference; Intel Mac ceiling
    "feedparser>=6.0",
    "finnhub-python>=2.4",
    # Notifications
    "aiohttp>=3.9",
    # Dashboard
    "streamlit>=1.31",
    "plotly>=5.19",
    # Monitoring
    "psutil>=5.9",
    # Analytics
    "duckdb>=1.0",
    # Fractal analysis
    "pywavelets>=1.4",
    "shap>=0.42",
    # Optimization
    "optuna>=3.6",
    # Scheduling
    "apscheduler>=3.10",
    # Config & Logging
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # Web log viewer
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "packaging>=23.0",
]

[project.scripts]
ait = "ait.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ibkr: live tests requiring IB Gateway on 127.0.0.1:4002 (run with -m ibkr)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
