# ============================================================
# AIT v2 - Autonomous Intelligent Trading Configuration
# ============================================================

# ------------------------------------------------------------
# FIXED LIMITS  (comment only: NOT keys, NOT configurable here)
# Deliberately fixed in code, in one module: src/ait/config/invariants.py
# (one-line reason for each: docs/RUNBOOK.md "Fixed limits"; logged at every start
# as `fixed_limits_in_effect`). Editing this comment changes nothing; a test keeps
# it equal to the module.
#   ORDER_RATE_LIMIT_MAX = 8
#   ORDER_RATE_LIMIT_WINDOW_S = 60
#   NBBO_DISORDERLY_SPREAD_RATIO = 1.0
#   NBBO_STALE_SIGNAL_DEVIATION = 0.35
#   NBBO_MID_FLOOR = 0.05
#   LIVE_MAX_SPREAD_PCT = 0.15
#   LIVE_MIN_VOLUME = 10
#   PDT_MAX_DAY_TRADES = 3
#   PDT_WINDOW_DAYS = 5
#   BROKER_SNAPSHOT_TTL_SECONDS = 5.0
#   IC_BUDGET_CAPPED_MIN_WING = 1.0
# ------------------------------------------------------------

trading:
  mode: paper                          # paper | live
  # Universe pared down based on 4-year + 1-year backtests:
  # KEPT: SPY/QQQ/IWM/DIA (indices), NVDA/AMZN/AMD (range-bound mature)
  # DROPPED 4yr: MSFT, SOFI, AAPL, META, TSLA (catastrophic losses)
  # DROPPED 1yr: GOOGL (-66%), PLTR (-33%) - became momentum stocks, hostile to iron condors
  # GLD/TLT/XLE added 2026-07-07 (audit R2): the index cluster (SPY/QQQ/IWM/DIA,
  # corr ~0.95) caps at 2 concurrent positions, saturating the book at ~5 of 8
  # slots. Gold/bonds/energy are liquid, optionable, and weakly correlated to
  # equities — they fill the idle slots AND diversify the short-vol tail.
  # USER DECISION 2026-07-22: index ETFs only ("like QQQ and SPY") — tightest
  # spreads, best fills, no single-name earnings gaps (the NVDA/AMZN condors
  # were in the 07-13 mess and cost-dominated). IWM kept: same category,
  # cheaper strikes. Was: [SPY, QQQ, IWM, DIA, NVDA, AMZN, AMD, GLD, TLT, XLE]
  universe: [SPY, QQQ, IWM]
  scan_interval_seconds: 300           # 5 minutes between scans
  max_daily_trades: 12                  # Raised for higher trade volume / faster learning
  trading_hours_only: true             # Only trade during RTH (9:30-16:00 ET)
  no_new_entries_minutes_before_close: 15   # W35: was a bare 900s in bot/scheduler.py
  # W69: the intraday trade-budget windows and the first-hour confidence gate
  # (were literals in bot/orchestrator.py). Cumulative caps, still bounded by
  # max_daily_trades; the whole remaining budget is released after midday_end_et.
  first_hour_end_et: "10:30"           # ET; before this: first_hour_trade_budget
  first_hour_trade_budget: 2
  midday_end_et: "14:00"               # ET; before this: midday_trade_budget
  midday_trade_budget: 4
  first_hour_min_confidence: 0.85      # DIRECTIONAL signals only; neutral/IC exempt

account:
  pdt_protection: true                 # Enable Pattern Day Trader guard
  pdt_account_under_25k: false         # R16: this paper account is $198k — PDT
                                       # is legally inapplicable >= $25k, and the
                                       # guard was able to VETO same-day stop-loss
                                       # exits ("riding unprotected"). RE-FLIP TO
                                       # true at go-live if the real account < $25k.
  capital: 5000                        # W-capital: THE one capital number (operator decision
                                       # 2026-10-08). Research starts every run with this much
                                       # TOTAL equity as ONE shared pool across symbols; live
                                       # simulates this NLV while simulate_live_capital is true.
                                       # Change it here and nowhere else. Replaces .env
                                       # AIT_SIMULATED_CAPITAL (10000) and backtest.initial_capital.
                                       # NOTE at $5k: risk.max_position_risk_pct (1.33%) funds $66
                                       # per trade and the 2% breaker is $100 -> the cap-grid
                                       # coherence check fires and the bot emits no condors until
                                       # the risk knobs are revisited (accepted by the operator).
  simulate_live_capital: true          # false at go-live. Per-box override: .env
                                       # AIT_SIMULATED_CAPITAL=<n> (or 0 = off) beats this.
  # W69: capital-tier boundaries (were literals in risk/capital_tiers.py). The
  # tier picks the universe filter; must ascend strictly.
  capital_tier_small_min: 2000
  capital_tier_medium_min: 5000
  capital_tier_large_min: 25000

positions:
  max_open_positions: 10               # R6 (user-approved): 423 of 500 logged entry
                                       # rejections were THIS cap, not the credit cap —
                                       # +2 slots absorb defined-risk structures without
                                       # adding short-premium exposure (credit cap stays 6)
  max_position_pct: 0.05               # 5% of portfolio per position
  max_contracts_per_trade: 1           # Learning mode: 1 contract/trade = min cost = max # of trades
  entry_ladder_start: 0.25             # W36: home for AIT_ENTRY_LADDER_START
  entry_order_timeout_seconds: 240     # W36: home for AIT_ENTRY_ORDER_TIMEOUT
  # W70: the rest of the ENTRY order timeline (were literals in execution/executor.py).
  # Every age below is checked on the 30s fast-monitor tick, so a value under 30 takes
  # effect at the next tick. Each must stay below entry_order_timeout_seconds (startup
  # refuses otherwise). Full timeline and the evidence behind the floors: docs/RUNBOOK.md.
  #
  # How often an unfilled entry's limit steps toward marketable (0.25 / 0.60 / 1.00 of the offset).
  # Floor: 30s (the tick; below it steps are skipped, not honored) | Ceiling: 300s
  # IMPACT: lower = chases the market faster, gives away more of the spread;
  #         higher = more time sitting at the patient price.
  entry_ladder_step_seconds: 45
  # A PARTIALLY filled entry has its unfilled remainder cancelled after this long.
  # Floor: 5s | Ceiling: 300s
  # IMPACT: lower = orphaned remainders cleaned up sooner but a slow fill is cut short;
  #         higher = the remainder rides at a stale price longer.
  partial_fill_cancel_seconds: 30
  # An entry ABSENT from the broker's trade list is treated as still pending while younger
  # than this (a disconnect makes every working entry look cancelled for a moment).
  # Floor: 10s | Ceiling: 120s
  # IMPACT: too low = a connection blip can flip live entries to CANCELLED while they are
  #         still working at IBKR; too high = a genuinely cancelled entry holds its slot longer.
  absent_order_grace_seconds: 30
  max_portfolio_delta: 0.30            # Net delta limit (absolute)
  max_portfolio_risk_pct: 0.20         # Aggregate open capital-at-risk cap (now WIRED — was a
                                       # phantom 0.02 never read while manager hardcoded 0.20;
                                       # audit 2026-07-07 item 3.3. 0.20 = operating value since 06-30)

# W69: the position sizer's multiplier curves (were literals in
# risk/position_sizer.py). Values are the former literals — no behavior change.
position_sizing:
  confidence_size_floor: 0.30          # lowest confidence multiplier
  iv_full_size_max: 0.20               # implied vol <= this -> full size
  iv_floor_size_min: 0.60              # implied vol >= this -> iv_floor_size_factor
  iv_floor_size_factor: 0.50
  iv_rank_adj_min: 0.80                # IV-rank multiplier band (sell at rank 0 / buy at 100)
  iv_rank_adj_max: 1.20
  drawdown_tiers:                      # [consecutive_losing_days, size_factor], ascending
    - [3, 0.50]
    - [5, 0.25]
  vix_size_tiers:                      # [vix_at_or_above, size_factor], ascending
    - [25, 0.75]
    - [30, 0.50]
  strategy_risk:                       # fraction of the position budget per strategy
    long_call: 1.0
    long_put: 1.0
    covered_call: 0.5
    cash_secured_put: 0.5
    bull_call_spread: 0.6
    bear_put_spread: 0.6
    iron_condor: 0.4
    long_straddle: 1.2
    short_strangle: 0.8
    calendar_spread: 0.7
    event_straddle: 0.7

risk:
  max_daily_loss_pct: 0.045            # W64 (2026-10-08): 0.02 -> 0.045 at the $5k account. Breaker =
                                       # $225 vs the largest condor the live builder emits at the 5%
                                       # budget (real IWM/SPY chains: $3-wide, max loss $201-212) =>
                                       # >= 1.0x, inside breaker_to_max_loss_ratio. Trips on realised AND
                                       # mark-to-market daily loss; blocks ENTRIES only.
  breaker_to_max_loss_ratio: 1.0       # W64: startup coherence rule (alert-only), breaker >= ratio x the
                                       # largest max loss the builder emits. Was a hardcoded 1.5; set 1.5
                                       # to restore the strictest rule (then breaker needs ~6.4% at $5k).
  max_consecutive_losses: 3            # Pause after 3 consecutive losses
  pause_minutes_after_losses: 30       # Cool-down period
  max_api_failures: 5                  # Halt after 5 API failures in 10 min
  min_confidence: 0.50                 # At learning floor — capture more marginal signals to learn from (was 0.55)
  max_position_risk_pct: 0.05          # W64 (2026-10-08): 0.0133 -> 0.05 at the $5k account (budget $250).
                                       # MEASURED on live TWS chains (IWM/SPY, 22 DTE, delayed, the real
                                       # builder): budget $66 and $150 build NOTHING at the $0.70 credit
                                       # floor (a $2-wide condor credits only $0.62-0.68); $250 builds a
                                       # $3-wide condor, credit $0.88-0.99, max loss $201-212. Wing width
                                       # follows the budget (budget/90, snapped to the strike grid). The
                                       # startup self-test's synthetic chain is more generous ($0.755 at
                                       # $2-wide) and would have passed 3% while live placed no trades.
                                       # History: 0.03 -> 0.0133 on 2026-09-29 (PLAN, closes W52a item 3)
                                       # so one max-loss condor could not exceed the old 2% breaker; W64
                                       # moves the breaker with the budget instead. Per-trade max_loss cap
                                       # vs NLV, also the budget the builder is handed. Must stay <=
                                       # positions.max_position_pct (Settings validates: 0.05 = equal OK).
  max_correlation: 0.75                # Correlation above which symbols count as the same bet
  max_correlated_positions: 2          # Positions per correlated cluster (was code default)
  post_stop_cluster_cooldown_minutes: 120  # W26: post-stop re-entry block for CLUSTER SIBLINGS
                                       # (SPY/QQQ/IWM are one cluster). The stopped symbol itself
                                       # keeps the full 1-trading-day R12-B4 window; siblings get
                                       # this. 0 = disable sibling scoping (pre-W26 behaviour).
  max_credit_positions: 6              # Cap on simultaneous short-premium positions (audit R2)
  # R20b follow-up: these three RiskConfig fields were claimed "relocated to
  # config.yaml" (PLAN.md R20 entry / settings.py descriptions) but were
  # never actually declared here -- silently falling back to the pydantic
  # Field defaults below (values unchanged; this closes the documentation/
  # consistency gap so config.yaml really is the operating source).
  pre_event_blackout_days: 1           # Block new credit entries within N days of a macro event
  credit_cap_vix_tiers:                # VIX-tiered credit-position caps as [vix_below, cap], first match wins
    - [20.0, 6]
    - [25.0, 4]
    - [999.0, 2]
  max_symbol_concentration_pct: 0.20   # Max fraction of account in one symbol (gate 6c)
  skip_macro_events: true              # R19c: macro-event protection (2026-07-08 decision).
  iv_rank_cap: 85                      # W36: home for AIT_IV_RANK_CAP (no new short premium above)
  max_positions_per_expiry: 3          # W36: home for AIT_MAX_PER_EXPIRY
                                       # Condors are code-exempt from the flatten; this governs
                                       # entry gates + undefined-risk flattens.
  credit_vix_halt: 28                  # No NEW credit entries at/above this VIX (audit R2)
  # W69: Friday weekend-gap rule (was literals in risk/manager.py, on a naive
  # local clock; now ET). After the cutoff these strategies need the confidence.
  weekend_gap_cutoff_et: "14:30"
  weekend_gap_min_confidence: 0.90
  weekend_gap_strategies: [short_strangle]

options:
  delta_range: [0.20, 0.50]            # Target delta for long options
  dte_range: [14, 30]                  # R12-B (cadence): min DTE 7 -> 14. 7-DTE entries were
                                       # 2-day churn (forced out by the DTE<=5 exit almost
                                       # immediately), best case ~60% cost-dominated — commissions
                                       # and crossing ate the theta. 14 gives >=9 days of runway
                                       # ahead of the DTE<=5 forced exit (guard comment in
                                       # execution/portfolio.py). History: [14,45] -> [7,30] (R2
                                       # clean-sample sprint) -> [14,30] (R12-B).
  min_open_interest: 10                # Loosened: paper account on delayed data
  min_volume: 0                        # Delayed feeds report volume=0; relaxed pydantic floor too
  max_bid_ask_spread_pct: 0.40         # Loosened: stale-quote spreads run wider
  risk_free_rate: 0.05                 # W36: was a bare r = 0.05 in the Greeks math
  strategies:
    # USER DECISION 2026-07-22 (at close #12): IRON CONDOR ONLY — the stated
    # mission (PLAN line 3). The fillers were churn: long_straddle bled -55%
    # over 2 weeks then needed a manual flatten (no combo quotes to exit);
    # the directional long options were delayed-quote coin flips (-22.91,
    # -102.30, -22.91). The verdict sample from here forward is IC closes on
    # index ETFs — one strategy, one clean question. Re-enable others only
    # by deliberate decision recorded in PLAN.
    - iron_condor
    # - long_call
    # - long_put
    # - bull_call_spread
    # - bear_put_spread
    # - long_straddle
    # - short_strangle   R6 (user-approved 2026-07-09): entries disabled — go-live
    #                     is defined-risk only, so strangle closes pad the 50-close
    #                     count while answering nothing (and carry 10-60x the live
    #                     risk budget: bot_state max-loss $1.5k-$8.2k vs $128-719 for
    #                     ICs). Open strangles are managed OUT by the widened macro
    #                     flatten (5d window). Re-enable only for a deliberate
    #                     edge-comparison experiment.
    # Disabled 2026-07-08 (Round 5 audit) — all four were dead weight or latent hazards:
    # - covered_call      R5: NO stock-ownership check exists -> a fill would be a NAKED
    #                     call booked as defined-risk; only blocked today by the 3% cap
    #                     arithmetic. Also permanently risk-rejected at this account size.
    # - cash_secured_put  R5: max_loss ~$8.5k+ always exceeds the 3% per-trade cap; pure
    #                     wasted scan cycles that burned execution fall-through slots.
    # - calendar_spread   R5: structurally dead — far leg needs 45-80 DTE but chains are
    #                     only fetched 7-30 DTE / 3 closest expiries. Never emitted a signal.
    # - event_straddle    R5: mutually exclusive with AIT_SKIP_MACRO_EVENTS=1 (enabled
    #                     2026-07-08 — scans skip event days entirely). Also days_to_event=0
    #                     accepts entry AFTER 8:30am releases, buying straight into IV crush.

backtest:
  position_size_pct: 0.05             # 5% of capital risked per trade (max-loss basis)
                                       # Raise to 0.20 for accounts < $10k (increases concentration risk)
  # W70: THE minimum iron-condor wing, dollars — for LIVE ENTRIES AND RESEARCH alike.
  # This key sits under `backtest:` but is also the config home of AIT_IC_WING_FLOOR,
  # which the live builder (strategies/iron_condor.py) reads: editing it changes what the
  # live bot TRADES, not only what a backtest simulates. Same precedence as wing_k:
  # env/.env AIT_IC_WING_FLOOR > this key > 2.0.
  # The wing is wing_k x price x IV x sqrt(DTE/365), never narrower than this. It binds
  # only when the per-trade budget does not: a budget-capped wing may shrink below it
  # (today's $5k account carries ~$2.78/wing), but never below $1 (a fixed limit, see
  # FIXED LIMITS). Bounds: 1.0 - 10.0 (startup refuses outside).
  # IMPACT: higher = wider minimum wing = more max loss per condor (the budget cap still
  #         wins when it binds); lower = narrower, cheaper condors with less credit.
  # History: was 5.0 (old backtest default; ~15 study scripts + run_optimizer read this
  # key and moved from 5.0 -> 2.0 in W70); live's $2 was a literal in iron_condor.py.
  wing_floor_dollars: 2.0
                                       # Wing sizing is now primarily driven by wing_k × expected_move
                                       # Lower to 0.5 for sub-$10 stocks (e.g. SOFI)
  # 2026-08-04 SHADOW R3 PROMOTION supersedes the 07-29 k=0.8 lock (that
  # study compared k under an UNSCALED ratio floor — population artifact,
  # see PLAN). LIVE runs k=1.6 with ratio floor 0.10 via env in
  # run_orchestrator.py (AIT_IC_WING_K / AIT_IC_MIN_CREDIT_WIDTH — the
  # authority for live). This yaml value feeds backtest/integration paths;
  # R16: aligned to the promoted live value.
  wing_k: 1.6
  # R19c (policy: config.yaml is THE home for trading values; env only
  # overrides; code defaults are a last-resort safety net):
  ic_min_credit_width: 0.10            # Credit/width floor — 0.10 pairs with k=1.6 wings
                                       # (2026-08-04 promotion: absolute credit demand unchanged)
  ic_min_credit: 0.70                  # Min total credit $/share (50% TP must clear ~3x costs)
  # W36: homes for the condor builder's remaining env knobs. Values = what live
  # has been running. The IV-rank floor is what refused every condor on
  # 2026-09-18 (IWM 3.6 / QQQ 12.3 / SPY 12.7) — it now logs when it does.
  ic_iv_rank_floor: 15                 # AIT_IRON_CONDOR_IV_FLOOR
  ic_delta_min: 0.15                   # AIT_IC_DELTA_MIN  (short-strike |delta| band)
  ic_delta_max: 0.30                   # AIT_IC_DELTA_MAX
  ic_em_min: 0.6                       # AIT_IC_EM_MIN     (short strike, in expected moves)
  ic_em_max: 1.3                       # AIT_IC_EM_MAX
  # W31: home for AIT_IC_CREDIT_RATIO_20D — the credit/width ratio at ~0.20
  # delta that the sizing self-test uses to advise a per-trade budget. Was a
  # bare 0.45 in orchestrator.py; this value IS that literal. R26 measured the
  # realized ratio at 0.375-0.386, so a retune is owed — but it moves the
  # advised funding number, so it gets its own wave with evidence.
  ic_credit_ratio_at_20d: 0.45
  credit_loss_limit: 0                 # Flat credit stop x credit; 0 = DISABLED
                                       # (R6/R12-B1: every flat level underperformed touch-close)
                                       # Optuna optimizes per walk-forward window [0.3 – 2.0]
                                       # 0.5 = half-sigma (tight), 1.0 = 1-sigma, 2.0 = 2-sigma (wide)
  iv_floor: 0.20                      # Min synthetic IV for option pricing
                                       # 0.20 = SPY/QQQ in normal markets
                                       # 0.30+ for high-vol stocks (NVDA, AMD)
  delta_iv_scale: 0.0                 # IV-driven delta scaling for strangles only: 0=static, 1=full IV response
                                       # High IV → lower effective delta → further OTM strikes
  max_concurrent_positions: 3         # Maximum simultaneously open positions (1=original single-position behavior)
  max_entry_vol_annual: 0.80          # Hard vol gate for iron condor / short strangle entry
                                       # Skip entry when 10-day realized vol (annualized) > this threshold
                                       # Optuna tunes per window in [0.25, 0.90]; 0.80 = permissive default
  optimize_n_trials: 50               # Optuna trials per walk-forward window
  optimize_patience: 20               # Early stopping: halt after N consecutive non-improving trials (0=disabled)
  optimize_min_trades: 10             # Min trades for full score; < 3 → always −100; 3–9 → quadratic penalty
  # R20b (pre-registered 2026-08-21): optimizer trial baselines moved from code
  # literals into config — values below = the operating literals they replace.
  stop_loss_pct: 0.35                 # Baseline stop-loss (fraction of position value)
  profit_target_pct: 0.50            # Baseline take-profit (fraction of position value)
  max_hold_days: 30                   # Baseline max holding period (calendar days)
  iv_rank_rise_threshold: 0.30        # Veto IC entry when IV rank rose > this over 10d (Exp 20)
  min_edge_over_baseline: 0.05        # Min range-model CV edge to activate the gate (Exp 28)
  # R20b: yaml homes for the existing fractal-regime fields the optimizer now
  # reads from loaded settings (previously 0.20/0.10/0.50 literals in bt_kwargs)
  hurst_regime_threshold: 0.20        # Hurst scale-spread above which confidence penalty applies
  hurst_regime_penalty: 0.10          # Confidence deducted in chaotic fractal regime
  multifractal_max_width: 0.50        # Multifractal width above which confidence penalty applies
  # W5 research-honesty block — three CONFIRMED research_validity findings in
  # reports/blindspot_composition_hunt_20260825.md. Together they are the size
  # of the whole per-condor expectancy, so every backtest absolute produced
  # BEFORE these landed is stale and must be re-run.
  # model-vs-reality-commission-constant: real IBKR cost is commission PLUS
  # regulatory/exchange/clearing fees, per leg, entry AND exit. Measured on the
  # repo's own executions ledger: all-in 0.9168/contract-leg (mean; median
  # 1.0284) vs the old flat 0.65 = $2.13/contract understated per condor
  # round trip.
  commission_per_contract: 0.65        # IBKR base options commission ($/contract/leg)
  regulatory_fees_per_contract: 0.2668 # Reg/exchange/clearing fees on top (0.9168 - 0.65)
                                       # 0.0 reproduces pre-W5 studies only
  # model-vs-reality-skew-10x-flat: the engine priced every strike off a
  # surface ~10x flatter than the measured one (hardcoded put slope 0.10 vs
  # 0.916-1.141 regressed on 3,159 IBKR quotes), so wings were near-free
  # (long put $0.08 model vs $0.71-0.92 real).
  skew_slope_per_pct_otm: 0.0736       # Relative put-side IV uplift per 1% OTM
                                       # (total slope 1.049 at atm_iv 0.1289 = the
                                       # sample-weighted measured value); 0 = pre-W5
  # W70: research-engine knobs that were constructor literals in backtesting/engine.py.
  # RESEARCH ONLY: none of these reaches the live bot (where one has a live twin, it is
  # named). The engine and the walk-forward resolve them from here.
  slippage_pct: 0.01                   # extra price slippage on DEBIT / long-option structures
                                       # only; NOT applied to iron condors (friction model).
  delta_short: 0.20                    # |delta| for short strikes in research. Live's IC short
                                       # delta is a literal ~0.20 in strategies/iron_condor.py,
                                       # NOT this key: changing this diverges research from live.
  delta_long: 0.30                     # |delta| for long single options / debit legs (unused by IC).
  hurst_hard_veto_multiplier: 1.5      # legacy veto = max(hurst_regime_threshold, 0.20) x this, used
                                       # only when fractal_veto_spread is unset. WalkForwardConfig
                                       # passes 0.0 (disabled); this governs a bare Backtester().
  pct_from_60d_high_threshold: -1.0    # experimental entry gate; -1.0 = DISABLED. e.g. -0.05 =
                                       # refuse neutral entries when spot is >5% below its 60d high.
  skew_factor: 1.0                     # multiplier on the legacy flat IV-skew term (0 = flat IV);
                                       # additive with skew_slope_per_pct_otm above.
  context_bars: 0                      # extra intraday lookback bars (0 = the engine minimum of 20).

ml:
  ensemble_weights:
    xgboost: 0.5
    lightgbm: 0.5
  retrain_interval_days: 7
  lookback_days: 504                   # 2 years of trading days
  min_training_samples: 100
  range_min_confidence: 0.65           # Floor for range/vol-mag model-overridden confidence (was hardcoded)
  # 2026-09-01 OBSERVE MODE (PLAN pre-registration). The retrained range model
  # is near coin-flip on SPY/QQQ (CV AUC 0.545/0.545, edge +0.045 vs the 0.05
  # min_edge threshold), so predict() returns None and W2's fail-CLOSED gate
  # blocked EVERY iron-condor entry: 16 candidates, 0 orders on 09-01. The ML
  # models keep predicting and logging; they no longer veto. Re-arm only if
  # the observe-mode record shows the gate would have improved PF.
  entry_gates_enabled: false
  observe_mode_neutral_confidence: 0.60  # direction-neutral structures skip the DIRECTIONAL min_confidence gate
  # W69: were literals in bot/orchestrator.py and ml/drift.py.
  regime_override_confidence: 0.80     # HIGH_VOLATILITY regime above this -> direction NEUTRAL
  drift_window_size: 50                # resolved predictions the drift detector scores
  drift_accuracy_threshold: 0.40       # rolling accuracy below this -> drift + retrain
  drift_calibration_threshold: 0.25    # high-confidence calibration error above this -> drift
  drift_high_confidence: 0.80          # calibration cohort cutoff / expected accuracy

# W69: regime classification thresholds (were literals in ml/regime.py).
regime:
  high_vol_vix: 30
  high_vol_realized: 0.40
  iv_crush_iv_rank_max: 0.25
  iv_crush_vol_max: 0.20
  iv_crush_trend_max: 0.20
  mean_revert_hurst_max: 0.40
  mean_revert_trend_max: 0.25
  low_vol_vix: 15
  low_vol_realized: 0.12
  low_vol_trend_breakout: 0.30
  strong_trend: 0.35

meta_label:
  enabled: false                       # Disabled: trained on corrupted data, rejects everything. See min_closes_to_enable below before re-enabling.
  min_probability: 0.50                # Min P(profitable) to take a trade (0.30-0.80)
  retrain_with_primary: true           # Retrain when primary model retrains
  # W49 (policy-vs-impl-7): the ONE close-count policy number -- config.yaml
  # used to say 50 here, PLAN.md's tracking table said 100+, and neither was
  # ever enforced in code. Real live entries stay ungated by this model until
  # reporting.go_live.real_close_count (IC-only, real closes) reaches this,
  # regardless of `enabled` above. Change it here, not in code.
  min_closes_to_enable: 100            # (30-500)

earnings:
  # W44 (R26 fail-direction-03/concurrency-4): unknown earnings data (never
  # fetched, or the last fetch failed with no usable last-known-good) now
  # refuses new entries for that symbol instead of silently allowing. Costs
  # nothing on the current ETF-only universe (SPY/QQQ/IWM have no earnings,
  # so their last-known-good already says so); protects the day single names
  # return. Flip to false to restore the pre-W44 always-allow behavior.
  refuse_entries_when_data_unavailable: true
  lkg_max_age_hours: 168               # Reuse a confirmed fetch for up to a week before treating it as unknown again
  buffer_days_before: 2                # Block entries / flag exits starting N days before a known earnings date
  buffer_days_after: 1                 # Keep the danger zone open N days after earnings (post-print IV settling)

dividends:
  # W51 (model-vs-reality-ex-div-assignment-void deep half): unlike earnings
  # above, this universe is NOT dividend-inert -- SPY/QQQ/IWM pay quarterly
  # and TLT pays monthly, so unknown dividend data refusing entries is a
  # real, regularly-armed protection, not a no-op. Flip to false to restore
  # always-allow if this ever misfires live.
  refuse_entries_when_data_unavailable: true
  lkg_max_age_hours: 168               # Reuse a confirmed fetch for up to a week before treating it as unknown again

assignment_response:
  # W53/W54b: rule 3/3e are wired to consult policy, but policy stays
  # close_only (today's real behavior) and execute_rolls stays false --
  # BOTH must be explicitly flipped before rule 3/3e ever compares or
  # places a roll instead of closing outright.
  policy: close_only
  execute_rolls: false
  # Which model decides close-vs-roll once policy == close_or_roll AND
  # execute_rolls is true. "ev" has NOT been backtested -- the historical
  # per-strike vol-surface backfill it needs is still running.
  # RECOMMENDED: leave this on "heuristic" until a real backtest validates
  # "ev" against history -- do not switch to "ev" in a live/paper account
  # before then.
  comparison_model: heuristic          # heuristic (recommended for now) / ev
  max_rolls_per_position: 2            # Hard cap, any roll, any trigger -- see settings.py
  roll_target_dte_min: 14              # Matches options.dte_range's live floor
  roll_target_dte_max: 30              # Matches options.dte_range's live ceiling
  roll_min_credit: 0.20                # Provisional -- no roll has executed live to calibrate against
  roll_short_delta_target: 0.20        # W69: new short strike |delta| (mirrors the IC entry delta)
  roll_short_delta_tolerance: 0.07     # W69: refuse the roll if the nearest strike is farther

condor_defense:
  # W56 (tastytrade-style tested/untested-side condor defense, decision
  # layer): enabled stays false pending the 50-close paper verdict -- the
  # values below have no live effect while it's off. check_positions is
  # already wired to consult this: enabled=true alone makes CLOSE
  # actionable and reports (but never acts on) a ROLL verdict.
  # execute_rolls is a further, separate opt-in (W61) required before a
  # ROLL verdict places a real order.
  enabled: false
  execute_rolls: false
  side: untested_only                  # tested_only / untested_only / both
  monitor_delta_max: 0.25              # Below this, hold
  roll_untested_delta_min: 0.25        # Roll the untested side for a credit in this band...
  roll_untested_delta_max: 0.30        # ...at this DTE window
  roll_untested_dte_min: 14
  roll_untested_dte_max: 21
  roll_tested_delta_min: 0.30          # Roll the tested side itself for a debit beyond this delta...
  roll_tested_dte_min: 22              # ...once DTE is beyond the roll-untested window
  close_delta_threshold: 0.40          # At or above this delta, close outright regardless of DTE/side

exit:
  exit_cross_amount: 0.10             # How far combo exits cross the spread to guarantee fills (was hardcoded)
  # W7/R24 logic-exit-risk-01: credit buyback ceiling as a multiple of the
  # CURRENT marked cost. The old bound included entry_credit + 25% of the
  # wing width, which dominated at $39-60 wings and priced take-profits at
  # 6-10x the mark (61 of 63 exits rejected by IBKR's price band).
  exit_mark_multiple: 1.5
  # W33 / R26 F1: the ceiling is compared with an ASK-side price, so it keeps
  # at least this much absolute headroom above the mark (four-leg half-spreads
  # do not shrink with the mark; 0.52-0.58 measured on QQQ 09-11).
  exit_min_ceiling_headroom: 0.60
  # W33: a broker-stated price band caps later exit attempts for this long.
  # Was a hardcoded hour, which could pin a stop below a market that had moved.
  exit_band_ttl_seconds: 300
  # W33b: each consecutive QUOTED exit that did not fill raises the next limit
  # by this fraction of the marketable price (caps unchanged). On delayed data
  # `ask + cross` never catches a trending tape (2026-09-21 touch stop).
  exit_unfilled_escalation_pct: 0.05
  # W33: each consecutive no-quote exit placement steps this far above the
  # last (anchor + cross + n*step, capped) instead of repeating itself.
  exit_reprice_step: 0.10
  # W52a: how long a working, unfilled close order rests before check_fills
  # cancels it for a re-price. Stops (stop_loss / short_strike_touch /
  # trailing_stop / breakeven_stop) rest the shorter value — the 2026-09-21
  # touch stop took 25 minutes at the old 300s on 15-minute-old quotes.
  exit_pending_rest_seconds: 300
  exit_stop_pending_rest_seconds: 120
  # W33: with no quote and no fresh mark, pay at most this multiple of the
  # entry credit (never more than the wing width). Was: the raw wing width.
  exit_blind_credit_multiple: 2.0
  credit_touch_stop: true              # W36: home for AIT_CREDIT_TOUCH_STOP
  trailing_stop_pct: 0.25             # Trail 25% below high water mark
  breakeven_trigger_pct: 0.30         # Move stop to breakeven at +30% P&L
  initial_stop_loss_pct: 0.50         # Fixed stop before breakeven activates
  partial_exit_levels:                 # Scale out at profit milestones
    - pnl_pct: 0.50                   # At +50%: close 33%
      close_pct: 0.33
    - pnl_pct: 1.00                   # At +100%: close another 33%
      close_pct: 0.33
  time_decay_scaling: true            # Lower take-profit target as DTE decreases
  volatility_adjusted_stops: true     # Widen stops for high-vol underlyings (ATR-based)
  auto_hedge: false                   # Auto-execute delta hedges (enable after paper testing)
  # W69: open-position thesis check (directional strategies only — iron condors
  # are exempt from the whole check). Were literals in bot/orchestrator.py.
  thesis_direction_flip_confidence: 0.70
  thesis_regime_shift_confidence: 0.70
  thesis_vix_spike_pct: 0.30           # exit if VIX is up more than +30% since entry
  # W70: the rest of the EXIT order timeline (were literals in execution/executor.py).
  # Together with exit_stop_pending_rest_seconds (120s) and exit_pending_rest_seconds
  # (300s) above. Checked on the 30s fast-monitor tick. Full timeline and the evidence
  # behind each floor: docs/RUNBOOK.md "Order lifecycle timeline".
  #
  # A freshly placed EXIT order is ignored by the fill checker for this long so it has
  # time to appear in IBKR's trade list.
  # Floor: 5s | Ceiling: 60s | Must be below exit_stop_pending_rest_seconds.
  # NOTE the floor is a margin, not a measurement: the one acknowledgement we could time
  # took under 1s (an entry, delayed-data paper); no exit has been timed yet. The
  # order_ack_latency log event is collecting the real numbers.
  # IMPACT: too low = a not-yet-visible order is misread as cancelled and the bot re-arms
  #         a duplicate close; too high = a genuinely dead order is noticed later.
  order_visibility_grace_seconds: 10
  # An exit order that belongs to ANOTHER clientId cannot be cancelled from here; after
  # this long the operator is paged instead.
  # Floor: 60s | Ceiling: 3600s | Must be >= exit_pending_rest_seconds.
  # IMPACT: lower = earlier, noisier pages; higher = a stuck cross-session close sits
  #         unnoticed longer.
  foreign_exit_escalation_seconds: 300
  # Zombie cap: an exit still unresolved this long after placement is checked against
  # the broker and, only if the broker answers and does not list it, the position is
  # reverted CLOSING -> FILLED so a fresh exit can fire (else held CLOSING + paged).
  # Floor: 2 x the longer rest time = 600s with today's rests (startup refuses lower)
  # | Ceiling: 7200s
  # IMPACT: too low = re-arms before the real outcome can show; a second close goes out
  #         alongside the first, both fill, and the condor flips into an inverse structure.
  #         too high = a dead order wedges the position in CLOSING for longer.
  zombie_exit_revert_seconds: 900

learning:
  enabled: true                          # Self-learning: adapt strategies from past trades
  paper_trading_mode: true               # R5 audit: this was NEVER set (code default False),
                                         # so Thompson re-ranking / adaptor overrides / flow
                                         # hard-gate bypasses were all INACTIVE, contradicting
                                         # PLAN.md's design. True = paper measures the fixed
                                         # ruleset so results stay comparable to the backtest.
                                         # MUST be set false (or removed) at go-live.
  lookback_days: 30                      # Analyze last 30 days of trades
  max_adaptations_per_cycle: 3           # Max config changes per learning cycle
  min_insight_confidence: 0.60           # Only act on insights above 60% confidence
  min_confidence_floor: 0.50             # Never lower min_confidence below 50%
  min_confidence_ceiling: 0.90           # Never raise min_confidence above 90%
  # W69: the four limits above are now actually read (they were ignored), and
  # the closed-trade analyzer's insight cutoffs live here (were literals in
  # learning/analyzer.py). Minimum-sample counts stay in code.
  analyzer:
    strategy_poor_win_rate: 0.35       # strategy (>=5 closes) -> disable_<strategy>
    strategy_strong_win_rate: 0.65     # strategy (>=5 closes, +P&L) -> boost_<strategy>
    confidence_band_poor_win_rate: 0.40
    symbol_poor_win_rate: 0.30
    regime_poor_win_rate: 0.35
    hour_poor_win_rate: 0.30
    exit_giveback_threshold: 0.30
    exit_min_avg_peak: 0.20
    direction_peak_threshold: 0.05
    direction_good_accuracy: 0.60
    direction_exit_problem_rate: 0.40
    direction_poor_accuracy: 0.45

sentiment:
  enabled: true
  weight: 0.20                         # Sentiment contributes 20% to final signal
  cache_ttl_seconds: 300               # 5 min cache
  sources:
    news: true
    fear_greed: true
    finbert: false   # DISABLED: torch DLL load segfaults the whole process on
                     # this machine (c0000005 in torch _load_dll_libraries,
                     # crashed the bot every 30-60 min). news + fear_greed remain.

notifications:
  telegram:
    # W39: `enabled` now actually gates the notifier (it did not before — the
    # only real switch was whether .env carried a token and chat id, so setting
    # this to false changed nothing). Turning it off ALSO stops the
    # manual-position poller, so HALT_UNTRACKED prompts cannot be answered and
    # entries stay frozen; startup warns when that happens.
    # The four send_* flags that used to live here were deleted: nothing read
    # them, and wiring them would have put four fail-open gates on alert paths.
    enabled: true

dashboard:
  enabled: true                        # W69: now read — false = supervisor does not launch Streamlit
  port: 8501                           # W69: now read by orchestration/master.py (was hardcoded)
  weblog_port: 8502                    # W69: web_logs.py log viewer
  status_port: 8503                    # W69: status_server.py live status / scorecard

logging:
  level: INFO
  file: logs/ait.log
  max_bytes: 20971520                  # 20 MB (10MB x5 held ~20 min under IBKR error spam —
  backup_count: 10                     #  destroyed forensic evidence; now ~200MB / hours of history)

# W31 (R26 F4): the synthetic chain the launch sizing self-test builds so it can
# run the REAL condor builder instead of modelling it. SELF-TEST FIXTURES, not
# trading values — nothing in the entry/exit/backtest path reads them. They are
# here rather than as literals because the self-test's verdict depends on them.
# The $1 probe price these replace drove the vol term under the builder's own $2
# floor, so every account above ~$6k was sized from the same $130 structure
# while real condors risk $30-60 wings.
sizing_probe:
  underlying_price: 660.0              # near the live universe's largest name
  implied_vol: 0.20
  dte: 21                              # the builder's own fallback DTE
  strike_grids: [1.0, 5.0]             # $5 is what reproduces the silent case:
                                       #  snapping widens past the budget and the
                                       #  builder emits zero (old check: problems=0)
  iv_rank: 55.0                        # must clear backtest.ic_iv_rank_floor, or
                                       #  the probe measures the floor, not the caps

# W76: supervisor-run 0-6 DTE friction collection (research data only; never touches orders).
# Everything below is the MODEL DEFAULT (collection OFF). To enable: uncomment the block, set
# short_dte_enabled: true, and restart the SUPERVISOR (a process runs on the settings it started
# with). First prove it manually: docs/RUNBOOK.md "Short-DTE friction collection".
# data_collection:
#   short_dte_enabled: false        # run the collector from the supervisor, Mon-Fri
#   short_dte_time_et: "15:30"      # BEFORE the close: IB drops the expiring contract after it (DTE 0)
#   short_dte_symbols: [QQQ]        # ~30-55 min each at IB's historical-data pacing
#   short_dte_client_id: 91         # must not be IBKR_CLIENT_ID or its +100..+104 ladder
#   short_dte_max_dte: 6
#   short_dte_duration: "7 D"
#   short_dte_timeout_minutes: 150  # hard cap per run
#   short_dte_idle_minutes: 20      # kill if silent this long
